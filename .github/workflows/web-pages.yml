name: Web Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          cp web/index.html index.html
          cp web/admin.html admin.html
          python - <<'PY'
          from pathlib import Path
          css = r'''
          :root{--primary:#c8102e!important;--primary2:#8f0d22!important;--bg:#f7f3f4!important;--line:#eadde0!important;--muted:#667085!important}
          body{background:linear-gradient(180deg,#fff8fa,#f3eaed)!important}
          .top{background:linear-gradient(135deg,#79091d,#c8102e 55%,#a30c27)!important;box-shadow:0 8px 28px #8f0d2238!important;border-bottom:3px solid #d7a928!important}
          .logo{background:#fff!important;border:2px solid #d7a928!important;border-radius:50%!important;background-image:url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png')!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;color:transparent!important;font-size:0!important;box-shadow:0 5px 16px #0002!important}
          .hero{position:relative!important;background:linear-gradient(135deg,#8f0d22,#c8102e 62%,#d7a928)!important;color:#fff!important;border:0!important;box-shadow:0 18px 42px #8f0d2238!important;overflow:hidden!important}
          .hero:after{content:''!important;position:absolute!important;right:28px!important;top:50%!important;transform:translateY(-50%)!important;width:118px!important;height:118px!important;border-radius:50%!important;background:#fff url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png') center/contain no-repeat!important;border:4px solid #d7a928!important;box-shadow:0 10px 30px #0003!important}
          .card{border-color:#eadde0!important;box-shadow:0 8px 28px #4b0b1512!important}.feature{border-top:3px solid #c8102e!important}.feature:hover{box-shadow:0 15px 34px #8f0d2222!important}.item{border-color:#eadde0!important;border-left:4px solid #c8102e!important}.person{border-color:#eadde0!important;border-top:3px solid #c8102e!important}
          .primary{background:linear-gradient(135deg,#8f0d22,#c8102e)!important;box-shadow:0 8px 18px #8f0d2228!important}.link-btn,.nav button.active{color:#c8102e!important}.pill{background:#ffe7ec!important;color:#8f0d22!important}.doc-btn{background:#c8102e!important}
          .login{background:radial-gradient(circle at top,#fff0f3,#f6eef0 55%,#eadfe2)!important}.login-box{border-color:#eadde0!important;box-shadow:0 25px 70px #6f102225!important}.login-box .logo{width:92px!important;height:92px!important;margin:0 auto 16px!important;border-width:3px!important}
          .avatar{background:#fff url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png') center/contain no-repeat!important;border:2px solid #d7a928!important}.avatar.small{background-size:contain!important}
          input:focus,textarea:focus,select:focus{border-color:#c8102e!important;box-shadow:0 0 0 3px #c8102e18!important}
          #app .topin{position:relative!important;display:flex!important;align-items:center!important;gap:10px!important}.topin:before{content:''!important;width:44px!important;height:44px!important;flex:0 0 44px!important;border-radius:50%!important;background:#fff url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png') center/contain no-repeat!important;border:2px solid #d7a928!important;display:block!important;box-shadow:0 4px 14px #0003!important}
          @media(max-width:600px){.hero:after{width:76px!important;height:76px!important;right:15px!important}.hero{padding-right:105px!important}}
          '''
          for name in ('index.html','admin.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('</head>', '<style>'+css+'</style></head>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
