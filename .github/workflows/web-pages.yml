name: Web Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          cp web/index.html index.html
          cp web/admin.html admin.html
          python - <<'PY'
          from pathlib import Path
          css = r'''
          :root{--primary:#c8102e!important;--primary2:#8f0d22!important;--bg:#f7f3f4!important;--line:#eadde0!important;--muted:#667085!important}
          body{background:linear-gradient(180deg,#fff8fa,#f3eaed)!important}
          .top{background:linear-gradient(135deg,#79091d,#c8102e 55%,#a30c27)!important;box-shadow:0 8px 28px #8f0d2238!important;border-bottom:3px solid #d7a928!important}
          .logo{background:#fff!important;border:2px solid #d7a928!important;border-radius:50%!important;background-image:url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png')!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;color:transparent!important;font-size:0!important;box-shadow:0 5px 16px #0002!important}
          .hero{position:relative!important;background:linear-gradient(135deg,#8f0d22,#c8102e 62%,#d7a928)!important;color:#fff!important;border:0!important;box-shadow:0 18px 42px #8f0d2238!important;overflow:hidden!important}
          .hero:after{content:''!important;position:absolute!important;right:28px!important;top:50%!important;transform:translateY(-50%)!important;width:118px!important;height:118px!important;border-radius:50%!important;background:#fff url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png') center/contain no-repeat!important;border:4px solid #d7a928!important;box-shadow:0 10px 30px #0003!important}
          .card{border-color:#eadde0!important;box-shadow:0 8px 28px #4b0b1512!important}.feature{border-top:3px solid #c8102e!important}.feature:hover{box-shadow:0 15px 34px #8f0d2222!important}.item{border-color:#eadde0!important;border-left:4px solid #c8102e!important}.person{border-color:#eadde0!important;border-top:3px solid #c8102e!important}
          .primary{background:linear-gradient(135deg,#8f0d22,#c8102e)!important;box-shadow:0 8px 18px #8f0d2228!important}.link-btn,.nav button.active{color:#c8102e!important}.pill{background:#ffe7ec!important;color:#8f0d22!important}.doc-btn{background:#c8102e!important}
          .login{background:radial-gradient(circle at top,#8f0d22,#650016 58%,#43000d)!important;color:#fff!important}
          .login-header .brand-text strong,.login-header .brand-text small,.admin-link{color:#fff!important}
          .login-layout{position:relative!important;z-index:2!important}
          .login-box{border:1px solid #eadde0!important;box-shadow:0 25px 70px #26000d66!important}
          .login-box .logo{width:92px!important;height:92px!important;margin:0 auto 16px!important;border-width:3px!important}
          .avatar{background:#fff url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png') center/contain no-repeat!important;border:2px solid #d7a928!important}.avatar.small{background-size:contain!important}
          input:focus,textarea:focus,select:focus{border-color:#c8102e!important;box-shadow:0 0 0 3px #c8102e18!important}
          #app .topin{position:relative!important;display:flex!important;align-items:center!important;gap:10px!important}.topin:before{content:''!important;width:44px!important;height:44px!important;flex:0 0 44px!important;border-radius:50%!important;background:#fff url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png') center/contain no-repeat!important;border:2px solid #d7a928!important;display:block!important;box-shadow:0 4px 14px #0003!important}
          .modal{z-index:99999!important;position:fixed!important;inset:0!important;background:rgba(24,0,9,.82)!important;display:grid!important;place-items:center!important;padding:18px!important;pointer-events:auto!important}
          .modal.hidden{display:none!important}
          .modal-box{position:relative!important;z-index:100000!important;width:min(620px,calc(100vw - 32px))!important;max-height:90vh!important;overflow:auto!important;background:#fff!important;color:#24242a!important;border-radius:12px!important;padding:26px!important;box-shadow:0 30px 90px rgba(0,0,0,.45)!important}
          .modal-box input,.modal-box textarea,.modal-box select{color:#24242a!important;background:#fff!important;opacity:1!important;pointer-events:auto!important}
          .password-wrap{position:relative!important;width:100%!important}.password-wrap input{padding-right:54px!important}.password-toggle{position:absolute!important;right:8px!important;top:50%!important;transform:translateY(-50%)!important;border:0!important;background:#f4f4f5!important;color:#650016!important;border-radius:6px!important;width:42px!important;height:38px!important;cursor:pointer!important;font-size:18px!important;z-index:5!important}
          .config-link{display:none!important}
          @media(max-width:600px){.hero:after{width:76px!important;height:76px!important;right:15px!important}.hero{padding-right:105px!important}.login{min-height:100vh!important}.login-shell{padding-bottom:28px!important}.login-layout{gap:14px!important}.login-visual{min-height:300px!important}.login-box{padding:24px 18px!important}.modal{padding:10px!important}.modal-box{width:calc(100vw - 20px)!important;max-height:88vh!important;padding:20px!important}}
          '''
          js = r'''
          (function(){
            var SERVER='https://script.google.com/macros/s/AKfycbxzz9H1szCdHnYrlHGyUHzIuY22OKuzx3I9z56anbLHCr5fPJZFX9yypC5KeW68QCBA/exec';
            function setupPassword(){
              var p=document.getElementById('loginPass');
              if(!p||p.dataset.toggleReady)return;
              p.dataset.toggleReady='1';
              var w=document.createElement('div');w.className='password-wrap';
              p.parentNode.insertBefore(w,p);w.appendChild(p);
              var b=document.createElement('button');b.type='button';b.className='password-toggle';b.setAttribute('aria-label','Tampilkan kata sandi');b.textContent='👁';
              b.onclick=function(){var show=p.type==='password';p.type=show?'text':'password';b.textContent=show?'🙈':'👁';b.setAttribute('aria-label',show?'Sembunyikan kata sandi':'Tampilkan kata sandi')};w.appendChild(b);
            }
            function hideConfig(){
              var c=document.querySelector('.config-link');if(c)c.style.display='none';
              var m=document.getElementById('config');if(m)m.classList.add('hidden');
              try{localStorage.removeItem('sp_key');localStorage.setItem('sp_url',SERVER)}catch(e){}
            }
            function authLogin(){
              var id=(document.getElementById('loginId')||{}).value||'';
              var pass=(document.getElementById('loginPass')||{}).value||'';
              var err=document.getElementById('loginError'),btn=document.getElementById('loginBtn');
              id=id.trim();
              if(!id||!pass){if(err)err.textContent='ID/NIP dan password wajib diisi.';return}
              if(btn){btn.disabled=true;btn.textContent='MEMPROSES...'}
              if(err)err.textContent='';
              fetch(SERVER,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',id:id,password:pass})})
                .then(function(r){return r.text()})
                .then(function(t){var d;try{d=JSON.parse(t)}catch(e){throw new Error('Respons server tidak valid')};if(!d.ok||!d.token)throw new Error(d.error||'Login gagal');
                  localStorage.setItem('sp_url',SERVER);localStorage.setItem('sp_token',d.token);localStorage.removeItem('sp_key');localStorage.setItem('sp_member',JSON.stringify(d.data||{}));
                  window.member=d.data||{};window.data={};
                  var login=document.getElementById('login'),app=document.getElementById('app');if(login)login.classList.add('hidden');if(app)app.classList.remove('hidden');
                  if(typeof window.loadAll==='function')window.loadAll(); else if(typeof window.showHome==='function')window.showHome();
                })
                .catch(function(e){if(err)err.textContent=e.message||'Login gagal';})
                .finally(function(){if(btn){btn.disabled=false;btn.textContent='LOGIN PORTAL'}});
            }
            function patchApi(){
              window.api=function(action){
                var token=localStorage.getItem('sp_token')||'';
                if(!token)return Promise.reject(new Error('Silakan login terlebih dahulu.'));
                return fetch(SERVER+'?action='+encodeURIComponent(action)+'&token='+encodeURIComponent(token),{cache:'no-store'})
                  .then(function(r){return r.text()}).then(function(t){var d;try{d=JSON.parse(t)}catch(e){throw new Error('Respons server tidak valid')};if(!d.ok)throw new Error(d.error||'Gagal mengambil data');return d.data||[]});
              };
            }
            function patchLogin(){window.login=authLogin;}
            function init(){setupPassword();hideConfig();patchApi();patchLogin();}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(init,100)});else setTimeout(init,100);
            setTimeout(init,1000);setTimeout(init,2500);
          })();
          '''
          for name in ('index.html','admin.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('</head>', '<style>'+css+'</style><script>'+js+'</script></head>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
