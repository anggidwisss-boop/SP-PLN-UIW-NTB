name: Web Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          cp web/index.html index.html
          cp web/admin.html admin.html
          python - <<'PY'
          from pathlib import Path
          css = r'''
          :root{--primary:#c8102e!important;--primary2:#8f0d22!important;--bg:#f7f3f4!important;--line:#eadde0!important;--muted:#667085!important}
          body{background:#8f0d22!important}
          .top{background:linear-gradient(135deg,#650016,#97001f 55%,#b4002b)!important;box-shadow:0 8px 28px #43000d66!important;border-bottom:3px solid #d7a928!important}
          .logo{background:#8f0d22!important;border:2px solid #f0c85a!important;border-radius:50%!important;background-image:url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png')!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;color:transparent!important;font-size:0!important;box-shadow:0 5px 16px #0004!important}
          .hero{position:relative!important;background:linear-gradient(135deg,#650016,#97001f 58%,#b4002b)!important;color:#fff!important;border:0!important;box-shadow:0 18px 42px #43000d55!important;overflow:hidden!important}
          .hero:after{content:''!important;position:absolute!important;right:28px!important;top:50%!important;transform:translateY(-50%)!important;width:118px!important;height:118px!important;border-radius:50%!important;background:#8f0d22 url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png') center/contain no-repeat!important;border:4px solid #d7a928!important;box-shadow:0 10px 30px #0004!important}
          .card{border-color:#eadde0!important;box-shadow:0 8px 28px #4b0b1512!important}.feature{border-top:3px solid #c8102e!important}.feature:hover{box-shadow:0 15px 34px #8f0d2222!important}.item{border-color:#eadde0!important;border-left:4px solid #c8102e!important}.person{border-color:#eadde0!important;border-top:3px solid #c8102e!important}
          .primary{background:linear-gradient(135deg,#8f0d22,#c8102e)!important;box-shadow:0 8px 18px #8f0d2228!important}.link-btn,.nav button.active{color:#c8102e!important}.pill{background:#ffe7ec!important;color:#8f0d22!important}.doc-btn{background:#c8102e!important}
          .login{background:linear-gradient(135deg,#650016 0%,#97001f 48%,#b4002b 100%)!important;color:#fff!important;border-top:5px solid #d7a928!important;min-height:100vh!important}
          .login-shell{padding-top:26px!important}
          .login-header .brand-text strong{color:#fff!important;text-shadow:0 2px 10px #3b000888!important;font-weight:900!important;letter-spacing:.2px!important}
          .login-header .brand-text small{color:#ffe8a8!important;font-weight:700!important}
          .login-header .brand-logo{width:68px!important;height:68px!important;background:#8f0d22!important;border:3px solid #f0c85a!important;box-shadow:0 6px 20px #25000666!important}
          .admin-link{color:#ffe8a8!important;font-weight:800!important;text-shadow:0 1px 5px #3b000888!important}
          .login-visual{min-height:600px!important;background:radial-gradient(circle at center,#b4002b 0,#8f0d22 55%,#4d000f 100%)!important;border:1px solid #d7a92844!important;box-shadow:0 22px 55px #3b000d55!important}
          .login-visual:before{width:620px!important;height:620px!important;border-color:#ffffff24!important;box-shadow:0 0 0 55px #ffffff09,0 0 0 110px #ffffff06,0 0 0 165px #ffffff03!important}
          .login-visual-logo{width:380px!important;height:380px!important;background:#8f0d22!important;border:9px solid #f0c85a!important;padding:22px!important;box-shadow:0 28px 80px #2b000d77!important}
          .login-message{left:42px!important;bottom:42px!important}
          .login-message h1{font-size:40px!important;font-weight:900!important;text-shadow:0 3px 12px #3b000d99!important}
          .login-message p{font-size:17px!important;color:#fff!important;text-shadow:0 2px 8px #3b000d88!important}
          .login-box{background:#fff!important;border:1px solid #f1dce1!important;box-shadow:0 25px 70px #35000f66!important}
          .login-logo{width:138px!important;height:138px!important;background:#8f0d22!important;border:5px solid #f0c85a!important;padding:7px!important;box-shadow:0 12px 32px #35000f44!important}
          .login-box h2{color:#8f0d22!important;font-size:27px!important;font-weight:900!important}
          .login-box .sub{color:#667085!important;font-weight:600!important}
          .login-box .primary{background:linear-gradient(135deg,#8f0d22,#c8102e)!important}
          .config-link{border-color:#d9c7cc!important;color:#650016!important}
          input:focus,textarea:focus,select:focus{border-color:#c8102e!important;box-shadow:0 0 0 3px #c8102e18!important}
          #app .topin{position:relative!important;display:flex!important;align-items:center!important;gap:10px!important}.topin:before{content:''!important;width:52px!important;height:52px!important;flex:0 0 52px!important;border-radius:50%!important;background:#8f0d22 url('https://sppln.id/wp-content/uploads/2025/02/logo_sp2.png') center/contain no-repeat!important;border:2px solid #d7a928!important;display:block!important;box-shadow:0 4px 14px #0004!important}
          @media(max-width:900px){.login-visual-logo{width:300px!important;height:300px!important}.login-visual{min-height:500px!important}.login-header .brand-logo{width:58px!important;height:58px!important}}
          @media(max-width:600px){.hero:after{width:76px!important;height:76px!important;right:15px!important}.hero{padding-right:105px!important}.login-visual-logo{width:230px!important;height:230px!important}.login-visual{min-height:390px!important}.login-message{left:24px!important;bottom:25px!important}.login-message h1{font-size:30px!important}.login-box{padding:25px 20px!important}.login-logo{width:112px!important;height:112px!important}.login-header .brand-logo{width:52px!important;height:52px!important}}
          '''
          for name in ('index.html','admin.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('</head>', '<style>'+css+'</style></head>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
