<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin SP PLN UIW NTB</title><style>:root{--p:#0b5cab;--d:#083b75;--bg:#f4f7fb;--line:#e2e8f0;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#132238}.hidden{display:none!important}.top{background:linear-gradient(135deg,var(--d),var(--p));color:#fff;padding:16px 20px}.topin{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1150px;margin:auto;padding:22px 16px 40px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#edf6ff,#f8fafc)}.box,.card,.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px #0f172a0b}.login .box{width:min(430px,100%)}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid #cbd5e1}.danger{background:#b42318;color:#fff}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tabs button.active{background:var(--p);color:#fff}.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table table{border-collapse:collapse;width:100%;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafc}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{margin-top:10px;color:var(--muted);font-size:13px}.error{color:#b42318}.success{color:#087443}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.stat b{display:block;font-size:28px;margin-top:5px}.stat span{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;margin-top:14px}.toolbar input{flex:1}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:15px;z-index:20}.modal .box{width:min(650px,100%);max-height:92vh;overflow:auto}.row{display:flex;gap:8px}.row>*{flex:1}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{padding:14px}.wrap{padding:15px 10px 30px}}</style></head><body>
<div id="login" class="login"><div class="box"><h1 style="margin:0 0 6px">Admin SP PLN UIW NTB</h1><p style="color:#64748b">Kelola data organisasi dan layanan anggota.</p><label>ID Anggota / NIP</label><input id="id" autocomplete="username"><label>Password</label><input id="pass" type="password" autocomplete="current-password"><button id="loginBtn" class="primary" style="width:100%;margin-top:16px" onclick="adminLogin()">MASUK ADMIN</button><div id="msg" class="status"></div></div></div>
<div id="app" class="hidden"><header class="top"><div class="topin"><b>⚡ SP PLN UIW NTB — ADMIN</b><button class="secondary" onclick="logout()">KELUAR</button></div></header><main class="wrap"><div id="stats" class="stats"></div><div class="tabs" id="tabs"></div><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 id="title" style="margin:0">Data</h2><button class="primary" onclick="openAdd()">＋ Tambah</button></div><div class="toolbar"><input id="search" placeholder="🔎 Cari data..." oninput="render()"><button class="secondary" onclick="load()">↻ Muat ulang</button></div><div id="status" class="status"></div><div id="table" class="table" style="margin-top:14px"></div></div></main></div>
<div id="modal" class="modal hidden"><div class="box"><h2 id="formTitle" style="margin-top:0">Tambah Data</h2><div id="form" class="grid"></div><div class="row" style="margin-top:18px"><button class="secondary" onclick="closeModal()">Batal</button><button id="saveBtn" class="primary" onclick="save()">Simpan</button></div><div id="formMsg" class="status"></div></div></div>
<script>
const SHEETS={BERITA:['ID','JUDUL','ISI','FOTO','TANGGAL','PENULIS','STATUS_PUBLIKASI'],PENGUMUMAN:['ID','JUDUL','ISI','TANGGAL','STATUS'],AGENDA:['ID','NAMA_KEGIATAN','TANGGAL','WAKTU','LOKASI','KETERANGAN','STATUS'],PENGURUS:['ID','NAMA','JABATAN','BIDANG','UNIT','FOTO','KONTAK'],DOKUMEN:['ID','NAMA_DOKUMEN','KATEGORI','TAHUN','LINK_PDF','KETERANGAN'],PENGADUAN:['ID_PENGADUAN','ID_ANGGOTA','KATEGORI','JUDUL','ISI','LAMPIRAN','TANGGAL','STATUS','CATATAN_PENGURUS'],ANGGOTA:['ID_ANGGOTA','NAMA','NIP','UNIT','UP3','JABATAN','NO_HP','EMAIL','STATUS','FOTO','PASSWORD']};
let admin=null,current='BERITA',rows=[],editing=null,allData={};const $=id=>document.getElementById(id);const cfg=()=>({url:localStorage.getItem('sp_url')||'',key:localStorage.getItem('sp_key')||''});
async function post(body){const c=cfg();if(!c.url||!c.key)throw Error('Konfigurasi server belum tersedia.');const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,key:c.key})});const j=await r.json();if(!j.ok)throw Error(j.error||'Permintaan gagal');return j}
async function adminLogin(){const b=$('loginBtn');$('msg').className='status';$('msg').textContent='Memeriksa akses…';b.disabled=true;try{const j=await post({action:'admin_login',id:$('id').value.trim(),password:$('pass').value});admin={...j.data,password:$('pass').value};sessionStorage.setItem('sp_admin',JSON.stringify(admin));$('login').classList.add('hidden');$('app').classList.remove('hidden');buildTabs();await load();await loadStats()}catch(e){$('msg').className='status error';$('msg').textContent='✕ '+e.message}finally{b.disabled=false}}
function buildTabs(){$('tabs').innerHTML=Object.keys(SHEETS).map(s=>`<button class="secondary ${s===current?'active':''}" onclick="selectSheet('${s}')">${label(s)}</button>`).join('')}
function label(s){return ({BERITA:'📰 Berita',PENGUMUMAN:'📢 Pengumuman',AGENDA:'📅 Agenda',PENGURUS:'👥 Pengurus',DOKUMEN:'📄 Dokumen',PENGADUAN:'⚖️ Pengaduan',ANGGOTA:'👤 Anggota'})[s]||s}
async function fetchSheet(s){const c=cfg(),u=new URL(c.url);u.searchParams.set('action',s.toLowerCase());u.searchParams.set('key',c.key);const r=await fetch(u);const j=await r.json();if(!j.ok)throw Error(j.error||'Gagal memuat');return j.data||[]}
async function load(){ $('title').textContent=label(current);$('status').className='status';$('status').textContent='Memuat…';try{rows=await fetchSheet(current);allData[current]=rows;render();loadStats()}catch(e){$('table').innerHTML='<div style="padding:20px">Gagal memuat data.</div>';$('status').className='status error';$('status').textContent='✕ '+e.message}}
async function loadStats(){const names=Object.keys(SHEETS);try{const vals=await Promise.all(names.map(async s=>[s,(allData[s]??await fetchSheet(s))]));vals.forEach(([s,v])=>allData[s]=v);const pending=(allData.PENGADUAN||[]).filter(r=>!['Selesai','Ditutup'].includes(String(r.STATUS||'').trim())).length;$('stats').innerHTML=[['👤','Anggota',(allData.ANGGOTA||[]).length],['📰','Berita',(allData.BERITA||[]).length],['📅','Agenda',(allData.AGENDA||[]).length],['⚖️','Pengaduan',`${allData.PENGADUAN?.length||0} · ${pending} aktif`]].map(x=>`<div class="stat"><span>${x[0]} ${x[1]}</span><b>${esc(x[2])}</b></div>`).join('')}catch(e){$('stats').innerHTML=''}}
function selectSheet(s){current=s;$('search').value='';buildTabs();load()}
function render(){const h=SHEETS[current],displayHeaders=h.filter(x=>x!=='PASSWORD'),q=$('search').value.trim().toLowerCase();const filtered=rows.filter(r=>!q||h.some(x=>String(r[x]??'').toLowerCase().includes(q)));$('status').className='status';$('status').textContent=`${filtered.length} dari ${rows.length} data`;if(!filtered.length){$('table').innerHTML='<div style="padding:20px;text-align:center;color:#64748b">Belum ada data yang cocok.</div>';return}$('table').innerHTML=`<table><thead><tr>${displayHeaders.map(x=>`<th>${esc(x)}</th>`).join('')}<th>Aksi</th></tr></thead><tbody>${filtered.map(r=>{const i=rows.indexOf(r);return `<tr>${displayHeaders.map(x=>`<td>${esc(String(r[x]??'').slice(0,350))}</td>`).join('')}<td><div class="actions"><button class="secondary" onclick="openEdit(${i})">Edit</button><button class="danger" onclick="removeRow(${i})">Hapus</button></div></td></tr>`}).join('')}</tbody></table>`}
function openAdd(){editing=null;openForm({})}function openEdit(i){editing=i;openForm(rows[i])}function openForm(record){$('formTitle').textContent=editing===null?`Tambah ${label(current)}`:`Edit ${label(current)}`;$('form').innerHTML=SHEETS[current].map(h=>`<div><label>${esc(h)}</label>${h==='PASSWORD'?`<input id="f_${h}" type="password" value="" placeholder="Kosongkan jika tidak diubah">`:h==='ISI'||h==='KETERANGAN'||h==='CATATAN_PENGURUS'?`<textarea id="f_${h}" rows="4">${esc(record[h]||'')}</textarea>`:`<input id="f_${h}" value="${esc(record[h]||'')}">`}</div>`).join('');$('formMsg').textContent='';$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
async function save(){const record={};SHEETS[current].forEach(h=>{const el=$('f_'+h);if(h==='PASSWORD'&&editing!==null&&el.value==='')return;record[h]=el.value});$('formMsg').className='status';$('formMsg').textContent='Menyimpan…';$('saveBtn').disabled=true;try{await post({action:'admin_save',id:admin.ID_ANGGOTA,password:admin.password,op:editing===null?'append':'update',sheet:current,record});closeModal();await load();await loadStats()}catch(e){$('formMsg').className='status error';$('formMsg').textContent='✕ '+e.message}finally{$('saveBtn').disabled=false}}
async function removeRow(i){if(!confirm('Hapus data ini?'))return;try{await post({action:'admin_save',id:admin.ID_ANGGOTA,password:admin.password,op:'delete',sheet:current,record:rows[i]});await load();await loadStats()}catch(e){alert(e.message)}}
function logout(){sessionStorage.removeItem('sp_admin');admin=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pass').value=''}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.addEventListener('DOMContentLoaded',()=>{try{const raw=sessionStorage.getItem('sp_admin');if(raw){admin=JSON.parse(raw);$('login').classList.add('hidden');$('app').classList.remove('hidden');buildTabs();load();loadStats()}}catch(e){sessionStorage.removeItem('sp_admin')}});
</script></body></html>
